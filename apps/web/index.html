<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Calca — Describe what you want, get polished HTML/CSS design variations on an infinite canvas."
    />
    <meta property="og:title" content="Calca" />
    <meta
      property="og:description"
      content="Describe what you want, get polished HTML/CSS design variations on an infinite canvas."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Calca</title>
    <script>
      // Pre-React boot theme: mirrors __root.tsx's applier (keep in lockstep).
      // Reads the real settings blob — a stale "te-theme" key used to live here.
      (function () {
        try {
          var t = "system";
          var raw = localStorage.getItem("calca-settings");
          if (raw) t = JSON.parse(raw).theme || "system";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
