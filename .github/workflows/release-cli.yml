name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build from (e.g. v0.6.2)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write


jobs:
  i18n:
    name: Locale parity (intl-ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Fill + verify locale parity
        # Prerelease tier model (see .agents/docs/i18n.md): `en` is the only
        # authored locale; parity must be committed before the tag is cut.
        # `fill` is additive — on an at-parity tree it makes zero model calls
        # and changes nothing, so this is a cheap verify in the common case.
        # If the tag was cut without parity, `fill` repairs the sandbox copy,
        # `check` passes, and the diff gate below fails the release with
        # instructions — a tag can never absorb commits, so shipping anyway
        # would publish English-only artifacts.
        env:
          INTL_AI_API_KEY: ${{ secrets.INTL_AI_API_KEY }}
          INTL_AI_MODEL: ${{ vars.INTL_AI_MODEL }}
        run: |
          set -e
          bunx intl-ai fill
          bunx intl-ai check
          if [[ -n "$(git status --porcelain -- apps/web/messages intl-ai.lock.d)" ]]; then
            echo "::error::Locale files were not at parity when this tag was cut."
            echo "::error::Run 'bun run i18n:fill', commit apps/web/messages + intl-ai.lock.d, then re-tag."
            git status --porcelain -- apps/web/messages intl-ai.lock.d
            exit 1
          fi

  npm:
    name: Publish @calca/* to npm
    needs: i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          # Node >=22.14 + npm >=11.5.1: trusted publishing (OIDC) needs both.
          # tsdown needs Promise.withResolvers when it runs under node.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: bun install
      - run: bunx turbo build --filter=@calca/shared --filter=@calca/canvas-base --filter=@calca/canvas-ui --filter=@calca/canvas-flow --filter=@calca/mcp-core --filter=@calca/mcp
      - name: Publish publishable @calca/* packages
        # Trusted publishing (OIDC) replaces a stored NPM_TOKEN: npm CLI >=11.5.1
        # negotiates it from id-token: write, and adds provenance attestations.
        # bun pm pack (not npm pack) rewrites workspace:* deps to real versions;
        # npm publish then pushes the already-rewritten tarball.
        run: |
          set -e
          out=$(mktemp -d)
          for pkg in calca-shared canvas-base canvas-ui canvas-flow mcp-core mcp; do
            (cd "packages/$pkg" && bun pm pack --destination "$out" >/dev/null)
          done
          for tgz in "$out"/*.tgz; do
            spec=$(tar -xzOf "$tgz" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(`${p.name}@${p.version}`)})')
            # Skip versions already on the registry so a re-run after a partial
            # publish is idempotent.
            if npm view "$spec" >/dev/null 2>&1; then
              echo "skip: $spec already published"
              continue
            fi
            npm publish "$tgz" --access public --provenance
          done

  binaries:
    name: Compile calca (${{ matrix.target }})
    needs: i18n
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-linux-x64
          - bun-linux-x64-musl
          - bun-linux-arm64
          - bun-linux-arm64-musl
          - bun-darwin-x64
          - bun-darwin-arm64
          - bun-windows-x64
          - bun-windows-x64-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install
      - run: bunx turbo build --filter=@calca/shared --filter=@calca/canvas-base --filter=@calca/mcp-core --filter=@calca/mcp
      - name: Compile single-file binary
        run: |
          set -e
          out="dist-bin/calca-${{ matrix.target }}"
          mkdir -p dist-bin
          # --bytecode currently fails on this module graph (dynamic/json imports);
          # plain --compile already cold-starts in ~30 ms, well under the 100 ms budget.
          if [[ "${{ matrix.target }}" == bun-windows-* ]]; then
            bun build --compile --minify --target=${{ matrix.target }} \
              packages/mcp/src/cli.ts --outfile "$out.exe"
          else
            bun build --compile --minify --target=${{ matrix.target }} \
              packages/mcp/src/cli.ts --outfile "$out"
          fi
      - name: Checksums
        run: |
          cd dist-bin && sha256sum * > SHA256SUMS.partial && cat SHA256SUMS.partial
      - uses: actions/upload-artifact@v4
        with:
          name: calca-${{ matrix.target }}
          path: dist-bin/*
          if-no-files-found: error

  release:
    name: GitHub Release + checksums + attestations
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: calca-*
          path: dist-bin
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist-bin
          rm -f SHA256SUMS.partial
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          gh release create "$tag" dist-bin/* \
            --title "calca $tag" \
            --notes "calca CLI binaries + SHA256SUMS. Install via \`npx -y @calca/mcp\` or download a binary." \
            || gh release upload "$tag" dist-bin/* --clobber
      - name: Attest binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist-bin/*"
