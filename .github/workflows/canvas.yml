name: canvas

on:
  pull_request:
    paths:
      - "packages/canvas-*/**"
      - "packages/calca-shared/**"
      - "scripts/check-canvas-boundaries.ts"
      - "scripts/check-bundle-budgets.ts"
      - ".github/workflows/canvas.yml"
      - "turbo.json"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "packages/canvas-*/**"
      - "packages/calca-shared/**"

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx turbo build --filter=@calca/canvas-base --filter=@calca/canvas-ui --filter=@calca/canvas-flow
      - run: bunx turbo check:pack --filter=@calca/canvas-base --filter=@calca/canvas-ui --filter=@calca/canvas-flow
      - run: bun scripts/check-canvas-boundaries.ts
      - run: bun scripts/check-bundle-budgets.ts

  runtime-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run --cwd packages/canvas-base build
      - name: Node >= 20.19
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node smoke
        if: matrix.runtime == 'node'
        run: node packages/canvas-base/smoke.mjs
      - name: bun smoke
        if: matrix.runtime == 'bun'
        run: bun packages/canvas-base/smoke.mjs
      - name: deno smoke
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run packages/canvas-base/smoke.mjs
        if: matrix.runtime == 'deno'
