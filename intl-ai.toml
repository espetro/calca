# intl-ai — AI-assisted translation pipeline for apps/web.
# Docs: https://intl-ai.illo.fyi/guide/configuration
# Tier model: `en` is the only authored locale (tier-1, PR gate).
# All other locales reach parity as a prerelease step only — see
# .agents/docs/i18n.md and the `i18n` job in release-cli.yml.

locale_dir = "apps/web/messages"
source = "en"
# All locale tags lowercase: `pt-br` (Brazilian Portuguese, the volume market —
# `pt-pt` would be a separate target if ever needed), `zh-hans` (Simplified).
targets = ["es", "fr", "de", "pt-br", "it", "nl", "ja", "zh-hans"]

[provider]
kind = "http"
# Any OpenAI-compatible chat-completions endpoint. Currently Zhipu BigModel
# (GLM), whose key format matches the repo's env file; glm-4.5-flash is free.
# base_url was originally https://openrouter.ai/api/v1.
# Point base_url elsewhere to use another provider (OpenAI, LM Studio, ...).
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "${env:INTL_AI_MODEL}"
api_key = "${env:INTL_AI_API_KEY}"

# Release gate: only structural findings block. The LLM `judge` check stays
# advisory (never in fail_on) so a provider outage can never hold a release.
[check]
fail_on = ["missing", "stale", "invalid"]
